[mod]
id = "fabric_jar_bridge"
version = "0.2.0"
priority = 120

[compatibility]
horizon_revision = "8474ac55c9f6f581e2bb984af9efcb18666bdbb2"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "fabric_jar_bridge"
source = "runtime.rs"

[[module]]
id = "java_sidecar"
file = "crates/horizon-client/src/game.rs"
name = "fabric_java_bridge"
source = "java_runtime.rs"

# One exact-revision startup injection, before Horizon prepares resources.
# We must include ordinary Horizon content mods in the combined overlay.
[[injection]]
id = "content-startup"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[injection]]
id = "mod-list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
