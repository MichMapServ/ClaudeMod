name: hmod

on:
  push:
    branches: [main]
    paths: ["mods/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/**", ".github/workflows/hmod.yml"]
  pull_request:
    paths: ["mods/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/**", ".github/workflows/hmod.yml"]
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod directory under mods/ or all"
        default: all
        required: true
      horizon_ref:
        description: "Horizon branch for cargo-horizon-mod"
        required: false

permissions:
  contents: read

concurrency:
  group: hmod-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_GIT: ${{ vars.HORIZON_GIT || 'https://github.com/horizon-rust/horizon' }}
  HORIZON_REF: ${{ inputs.horizon_ref || vars.HORIZON_REF || 'main' }}
  CARGO_TERM_COLOR: always

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v

  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          WANTED: ${{ inputs.mod || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$WANTED" == all ]]; then
            names=$(find mods -mindepth 2 -maxdepth 2 -name horizon-mod.toml -printf '%h\n' | sed 's|^mods/||' | sort)
          else
            if [[ ! "$WANTED" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]] || [[ ! -f "mods/$WANTED/horizon-mod.toml" ]]; then
              echo "::error::Unknown mod: $WANTED"
              exit 1
            fi
            names="$WANTED"
          fi
          # Validate discovered paths too: a PR can introduce a folder whose
          # name would be unsafe if interpolated into subsequent shell steps.
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then
              echo "::error::Unsafe mod directory name: $name"
              exit 1
            fi
          done <<< "$names"
          json=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mods=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.mods != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Resolve Horizon commit
        id: horizon
        run: |
          set -euo pipefail
          sha=$(git ls-remote "$HORIZON_GIT" "refs/heads/$HORIZON_REF" | head -n1 | cut -f1)
          test -n "$sha" || { echo "::error::Horizon branch not found"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache Horizon CLI
        id: tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ steps.horizon.outputs.sha }}
      - name: Install Horizon CLI
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install --locked --git "$HORIZON_GIT" --branch "$HORIZON_REF" cargo-horizon-mod
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hmod-${{ matrix.mod }}
      - name: Rust unit tests
        working-directory: mods/${{ matrix.mod }}
        run: |
          if [[ -f Cargo.toml ]]; then
            cargo fmt --check
            cargo test --lib
          fi
      - name: Build, check and test
        id: build
        working-directory: mods/${{ matrix.mod }}
        run: |
          set -euo pipefail
          id=$(sed -nE 's/^[[:space:]]*id[[:space:]]*=[[:space:]]*"([a-z0-9_]+)".*/\1/p' horizon-mod.toml | head -n 1)
          if [[ ! "$id" =~ ^[a-z0-9_]{1,64}$ ]]; then
            echo "::error::Invalid or missing horizon-mod.toml id"
            exit 1
          fi
          touch "$RUNNER_TEMP/hmod-stamp"
          cargo horizon-mod build
          # Check the artifact corresponding to THIS mod, never another
          # newly-created .hmod elsewhere in the workspace.
          file=""
          for candidate in "$GITHUB_WORKSPACE/target/horizon-mod/$id.hmod" "$PWD/target/horizon-mod/$id.hmod"; do
            if [[ -s "$candidate" && "$candidate" -nt "$RUNNER_TEMP/hmod-stamp" ]]; then
              file="$candidate"
              break
            fi
          done
          test -n "$file" || { echo "::error::No freshly built $id.hmod was produced"; exit 1; }
          cargo horizon-mod check "$file"
          if compgen -G 'tests/*.toml' >/dev/null; then
            cargo horizon-mod test --hmod "$file"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Prepare distribution
        env:
          MOD_NAME: ${{ matrix.mod }}
          HMOD_FILE: ${{ steps.build.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -- "$HMOD_FILE" "dist/$MOD_NAME.hmod"
          (cd dist && sha256sum "$MOD_NAME.hmod" > "$MOD_NAME.hmod.sha256")
          echo "### $MOD_NAME : OK" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hmod-${{ matrix.mod }}
          path: |
            dist/${{ matrix.mod }}.hmod
            dist/${{ matrix.mod }}.hmod.sha256
          if-no-files-found: error

  result:
    needs: [scaffold, discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate all checks
        env:
          SCAFFOLD: ${{ needs.scaffold.result }}
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "scaffold=$SCAFFOLD discover=$DISCOVER build=$BUILD"
          [[ "$SCAFFOLD" == success && "$DISCOVER" == success && ( "$BUILD" == success || "$BUILD" == skipped ) ]]

  publish:
    # Only publish a binary after the complete workflow succeeds on main.
    needs: [result, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.result.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve verified HorizonUtilities artifact
        uses: actions/download-artifact@v4
        with:
          name: hmod-HorizonUtilities
          path: staging
      - name: Verify checksum and publish to dist/
        run: |
          set -euo pipefail
          (cd staging && sha256sum -c HorizonUtilities.hmod.sha256)
          test -s staging/HorizonUtilities.hmod
          mkdir -p dist
          cp staging/HorizonUtilities.hmod dist/HorizonUtilities.hmod
          cp staging/HorizonUtilities.hmod.sha256 dist/HorizonUtilities.hmod.sha256
          git add -f dist/HorizonUtilities.hmod dist/HorizonUtilities.hmod.sha256
          if git diff --cached --quiet; then
            echo "No artifact changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: publier HorizonUtilities.hmod validé par CI"
          git push origin HEAD:main
          echo "### Download: dist/HorizonUtilities.hmod" >> "$GITHUB_STEP_SUMMARY"
