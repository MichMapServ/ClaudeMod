name: Import HorizonUtilities v0.3 sources
on:
  push:
    branches: ["feature/HorizonUtilities-v0.3.0-hmod"]
    paths: [".github/workflows/import-v03.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/HorizonUtilities-v0.3.0-hmod
          persist-credentials: true
      - name: Verify and unpack prepared sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          root = pathlib.Path('.bootstrap')
          txt = ''.join((root / f'v03-part-{i}.b64').read_text() for i in range(1, 7))
          data = base64.b64decode(txt, validate=True)
          sha = hashlib.sha256(data).hexdigest()
          expected = '58d505204d0d1b07fb0b4dbc62984ab7720ed1a2f103903b4f76fd49cb3b008f'
          if sha != expected:
              raise SystemExit(f'Archive checksum mismatch: {sha}')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as tf:
              for member in tf.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  if not member.isfile() or p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe archive member: ' + member.name)
              tf.extractall('.', filter='data')
          print('Imported verified archive', sha)
          PY
      - name: Rust format and Python integrity tests
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 -m unittest discover -s scripts/tests -v
      - name: Commit real sources and delete bootstrap
        run: |
          set -euo pipefail
          git rm -r .bootstrap
          git rm .github/workflows/import-v03.yml
          git add Cargo.toml rust-toolchain.toml mods/HorizonUtilities/src mods/HorizonUtilities/Cargo.toml mods/HorizonUtilities/horizon-mod.toml scripts/build_hmod.sh scripts/tests/test_package.py .github/workflows/hmod.yml experimental/horizon-utilities-ext
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: importer HorizonUtilities 0.3 et les tests'
          git push origin HEAD:feature/HorizonUtilities-v0.3.0-hmod
