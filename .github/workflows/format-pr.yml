name: temporary rustfmt
on:
  push:
    branches: [feat/horizonutilities-hmod-native-upgrades]
    paths: [".github/workflows/format-pr.yml"]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/horizonutilities-hmod-native-upgrades
          persist-credentials: true
      - name: Format Rust code
        run: |
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mods/HorizonUtilities
            git commit -m "style: apply rustfmt to HorizonUtilities 0.2"
            git push origin HEAD:feat/horizonutilities-hmod-native-upgrades
          fi
