[workspace]
resolver = "3"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MichMapServ/ClaudeMod"

[workspace.dependencies]
horizon-mod-sdk = { git = "https://github.com/horizon-rust/horizon", branch = "main" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
